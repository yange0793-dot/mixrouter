name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 测试不过不发版
      - run: node --test test/*.test.js
      - name: 打包源码
        run: git archive --format=tar.gz -o "mixrouter-${GITHUB_REF_NAME#v}.tar.gz" HEAD
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mixrouter-*.tar.gz \
            --title "mixrouter $GITHUB_REF_NAME" \
            --generate-notes
