name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 零依赖,无需 install;测试自带隔离环境,不触碰真实配置
      # --test-timeout 是 Node 20.11+ 才有的 flag(v18.20.8 的 test runner 里没有),18 行退回裸命令,靠 timeout-minutes 兜底
      - run: node --test ${{ matrix.node != 18 && '--test-timeout=30000' || '' }} test/*.test.js
